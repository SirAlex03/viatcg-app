<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>V.I.A. TCG</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0d0f13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="V.I.A. TCG">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{
  --bg:#0d0f13; --surface:#151920; --surface2:#1c212b; --line:#262c38;
  --text:#e9ecf2; --muted:#8b93a4; --gold:#e8b04a; --gold2:#f5cd78;
  --green:#3fbf6f; --red:#ef5b5b; --blue:#5aa9ec; --violet:#a78bfa; --radius:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px!important}
html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
*{scrollbar-width:none}
*::-webkit-scrollbar{display:none;width:0;height:0}
.hidden{display:none!important}
.app{max-width:900px;margin:0 auto;padding:0 14px calc(150px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:20;background:rgba(13,15,19,.92);backdrop-filter:blur(10px);
  display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;margin:0 -14px 6px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;flex:1;min-width:0}
.brand svg{width:34px;height:34px;flex:none}
.wm{display:flex;flex-direction:column;line-height:1}
.wm b{font-size:18px;letter-spacing:.06em;color:var(--gold)}
.wm span{font-size:10px;letter-spacing:.42em;color:var(--muted);margin-top:3px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 11px;font-size:13px;cursor:pointer;white-space:nowrap}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:36px;height:36px;display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn svg{width:18px;height:18px}
.spin{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:22px 2px 10px;font-weight:600}
h4{margin:16px 2px 8px;font-size:14px;color:var(--gold)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(2,1fr)}
@media(min-width:700px){.grid.k3{grid-template-columns:repeat(3,1fr)}}
.kpi .l{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.kpi .l svg{width:15px;height:15px;color:var(--gold);flex:none;opacity:.9}
.kpi .tr{display:inline-block;font-size:11.5px;font-weight:600;margin-top:5px;padding:2px 7px;border-radius:999px;background:var(--surface2)}
.rtabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;margin:14px 0 4px}
.rtabs button{border:0;background:none;border-radius:9px;padding:8px 2px;font-size:13px;color:var(--muted);cursor:pointer}
.rtabs button.on{background:var(--gold);color:#16120a;font-weight:700}
.inc-ch{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:8px;overflow:hidden}
.inc-ch .hd{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer}
.inc-ch .hd .nm{flex:1;min-width:0}.inc-ch .hd .nm small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.inc-ch .hd .ar{color:var(--muted);transition:transform .2s}.inc-ch.open .hd .ar{transform:rotate(90deg)}
.inc-ch .bd{padding:0 14px 12px}.inc-ch .bd .sw{margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:7px}.chip svg{width:16px;height:16px;color:var(--muted)}
.fab span{display:none;font-weight:700;font-size:15px}
.fab.ext{width:auto;padding:0 20px 0 16px;gap:8px;display:flex;align-items:center}.fab.ext span{display:inline}
@media(max-width:999px){.item{gap:10px}.thumb{width:52px;height:52px}}
@media(min-width:1000px){
  .kpi.wide{grid-column:auto!important}
  .grid.soci{grid-template-columns:repeat(3,1fr)}
  .app{max-width:1180px}
  nav .in{max-width:1180px}
  .fab{right:max(16px,calc(50% - 574px))}
  .grid.k3{grid-template-columns:repeat(4,1fr)}
  #view .list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  #view .thumb{width:72px;height:72px}
  .cols2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 18px;align-items:start}
}
.kpi .v{font-size:21px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.kpi.hero{grid-column:1/-1;background:linear-gradient(135deg,#1d1a12,#151920 60%);border-color:#3a3020}
.kpi.hero .v{font-size:30px;color:var(--gold2)}
.pos{color:var(--green)}.neg{color:var(--red)}
.rows .r{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.rows .r:last-child{border-bottom:0}
.rows .r>span:last-child{font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
.muted{color:var(--muted)}.small{font-size:12px}
.nfil{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin:0 0 12px}
.nfil label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.nfil input,.nfil select{box-sizing:border-box;min-width:0;max-width:100%}
.nfil input[type=date]{width:100%;-webkit-appearance:none;appearance:none;min-height:42px;color-scheme:dark;color:var(--text)}
.nfil select{grid-column:1/-1;width:100%}
.nfil .btn{grid-column:1/-1}
.nov{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.nov-h{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.nov ul{margin:8px 0 0;padding-left:18px}.nov li{margin:5px 0;line-height:1.4}
.att-day{font-size:12px;color:var(--muted);margin:12px 2px 6px;text-transform:capitalize}
.att{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.att:first-child{border-top:0}.att .tx{flex:1;min-width:0}.att .tx .small{display:block;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att .rt{text-align:right;flex:none;font-size:12px;color:var(--muted)}.att .rt b{display:block;font-size:13px;margin-top:2px}
.selbar.five{grid-template-columns:repeat(3,1fr)}
.selbar .btn.ok{color:var(--green)}
.toolbar{display:flex;gap:8px;align-items:center;margin:14px 0 10px;flex-wrap:wrap}
.search{flex:1;min-width:140px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.sel-s{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 10px;max-width:100%}
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;white-space:nowrap;cursor:pointer}
.seg button.on{background:var(--gold);color:#16120a;border-color:var(--gold);font-weight:600}
.fchips{display:flex;gap:6px;flex-wrap:wrap;margin:-2px 0 10px}
.fchip{font-size:12px;border:1px solid #4d3c1c;background:#231d10;color:var(--gold);border-radius:999px;padding:4px 10px;cursor:pointer}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px;cursor:pointer}
.item.sel{border-color:var(--gold)}
.thumb{width:56px;height:56px;border-radius:10px;background:var(--surface2);flex:none;overflow:hidden;display:grid;place-items:center;color:var(--muted);position:relative}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb .n{position:absolute;right:3px;bottom:3px;background:rgba(0,0,0,.75);color:var(--gold);font-size:11px;font-weight:700;border-radius:6px;padding:1px 5px}
.item .main{flex:1;min-width:0}
.item .t{font-weight:600;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.25;word-break:break-word}
.item .sub{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .right{text-align:right;flex:none;font-variant-numeric:tabular-nums}
.item .amt{font-weight:700}
.badges{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.badge{display:inline-block;font-size:10.5px;padding:1px 6px;white-space:nowrap;border-radius:999px;background:var(--surface2);border:1px solid var(--line);color:var(--muted)}
.badge.g{color:var(--green);border-color:#24533a;background:#12241a}
.badge.r{color:var(--red);border-color:#5a2a2a;background:#261414}
.badge.y{color:var(--gold);border-color:#4d3c1c;background:#231d10}
.badge.b{color:var(--blue);border-color:#22415d;background:#111d29}
.badge.v{color:var(--violet);border-color:#3d3366;background:#1b1730}
.month{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin:16px 4px 6px}
.empty{text-align:center;color:var(--muted);padding:34px 10px;border:1px dashed var(--line);border-radius:var(--radius)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(17,20,26,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);
  display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav .in{display:flex;width:100%;max-width:900px}
nav button{flex:1;background:none;border:0;padding:9px 0 8px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;cursor:pointer}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--gold)}
.fab{position:fixed;right:max(16px,calc(50% - 434px));bottom:calc(76px + env(safe-area-inset-bottom));z-index:31;width:56px;height:56px;border-radius:18px;border:0;
  background:linear-gradient(135deg,var(--gold2),var(--gold));color:#16120a;box-shadow:0 8px 24px rgba(0,0,0,.45);display:grid;place-items:center;cursor:pointer}
.fab svg{width:26px;height:26px}
.ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;width:100%;max-width:640px;max-height:94vh;overflow:auto;
  padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:20px;border-bottom:1px solid var(--line)}}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.sheet-h h3{margin:0;font-size:18px}
#viewer .ov{z-index:70}
.viewer{max-width:100%;max-height:80vh;display:block;margin:0 auto;border-radius:10px}
label.f{display:block;margin:10px 0 0}
label.f>span{display:block;font-size:12px;color:var(--muted);margin:0 0 5px 2px}
label.f.bad>span{color:var(--red)}
label.f.bad .in-f{border-color:var(--red)}
.in-f{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px;outline:none}
.in-f:focus{border-color:var(--gold)}
select.in-f,.sel-s{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
input[type=date].in-f{min-height:44px;color-scheme:dark}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px}
fieldset{border:1px solid var(--line);border-radius:var(--radius);padding:4px 12px 12px;margin:14px 0 0}
legend{padding:0 6px;color:var(--gold);font-size:13px;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:600}
.btn.pri{background:var(--gold);border-color:var(--gold);color:#16120a}
.btn.dng{color:var(--red);background:transparent}
.btn.sm{padding:6px 10px;font-size:13px}
.btn[disabled]{opacity:.45;pointer-events:none}
.actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.actions .pri{flex:1}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.photo{display:flex;gap:12px;align-items:center}
.photo .pv{width:92px;height:92px;border-radius:12px;background:var(--surface);border:1px dashed var(--line);display:grid;place-items:center;overflow:hidden;color:var(--muted);font-size:12px;text-align:center;flex:none}
.photo .pv img{width:100%;height:100%;object-fit:cover}
.photo .b{display:flex;flex-direction:column;gap:6px;flex:1}
.hero-img{width:100%;max-height:300px;object-fit:contain;border-radius:12px;background:var(--surface);display:block;margin-bottom:10px}
.live{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-size:14px}
.err{color:var(--red);font-size:13px;margin-top:10px;min-height:1em}
.hint{color:var(--muted);font-size:12px;margin-top:6px}
.segf{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:6px}
.segf label{flex:1;text-align:center;padding:9px 6px;cursor:pointer;font-size:14px;background:var(--surface)}
.segf input{display:none}
.segf label.on{background:var(--gold);color:#16120a;font-weight:600}
.line{border:1px solid var(--line);border-radius:12px;padding:8px 10px 10px;margin-top:8px;position:relative}
.line .x{position:absolute;right:6px;top:6px;border:0;background:none;color:var(--muted);cursor:pointer;padding:4px}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer}
.sw .sl{min-width:0}.sw .sl b{display:block;font-size:15px}.sw .sl small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.tg{appearance:none;-webkit-appearance:none;width:51px;height:31px;border-radius:999px;background:#3a3f4a;position:relative;flex:none;cursor:pointer;transition:background .2s;margin:0;border:0;outline:none}
.tg::after{content:'';position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.35);transition:transform .2s}
.tg:checked{background:var(--green)}.tg:checked::after{transform:translateX(20px)}.tg:disabled{opacity:.5}
.chk{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:14px}
.chk input{width:20px;height:20px;accent-color:var(--gold)}
.pick{max-height:280px;overflow:auto;border:1px solid var(--line);border-radius:12px;margin-top:8px}
.pick label{display:flex;gap:10px;align-items:center;padding:9px 10px;border-bottom:1px solid var(--line);cursor:pointer}
.pick label:last-child{border-bottom:0}
.pick input{width:20px;height:20px;accent-color:var(--gold);flex:none}
.att{margin-top:8px}
.att .a{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;margin-top:6px;background:var(--surface)}
.att .a span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.att .addrow{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2))}
table.piano{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
table.piano th{color:var(--muted);font-weight:500;text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
table.piano td{text-align:right;padding:7px 4px;border-bottom:1px solid var(--line)}
table.piano th:first-child,table.piano td:first-child{text-align:left}
table.piano tr.paid td{color:var(--muted)}
table.piano tr.late td:first-child{color:var(--red)}
.scroll-x{overflow-x:auto}
.login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(24px + env(safe-area-inset-top)) 24px 24px;gap:18px}
.login .logo svg{width:84px;height:84px}
.login .wm{align-items:center}
.login .wm b{font-size:30px}
.login .wm span{font-size:12px}
.login .box{width:100%;max-width:340px}
.who{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.who button{padding:12px 0;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600}
.who button.on{border-color:var(--gold);color:var(--gold);background:#231d10}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:90;background:#262c38;border:1px solid #333b4a;
  padding:10px 16px;border-radius:12px;font-size:14px;max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.toast.e{background:#3a1b1b;border-color:#5a2a2a}
.chart svg{width:100%;height:auto;display:block;max-height:300px;margin:0 auto}
.kpi.wide{grid-column:1/-1}
.grid.soci{grid-template-columns:1fr}
img[data-foto]:not([src]){visibility:hidden}
.chart .cm{fill:transparent;cursor:pointer}.chart .cm.on{fill:rgba(255,255,255,.06)}
.ctip{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.ctip>b{color:var(--text);width:100%}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
.link{color:var(--gold);cursor:pointer;text-decoration:underline}
.ck{width:22px;height:22px;border:2px solid #3a4150;border-radius:7px;display:grid;place-items:center;flex:none;color:#16120a;font-weight:800;font-size:13px}
.ck.on{background:var(--gold);border-color:var(--gold)}
.selbar{position:sticky;bottom:calc(-20px - env(safe-area-inset-bottom));background:var(--bg);padding:10px 0 calc(10px + env(safe-area-inset-bottom));margin-top:12px;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.selbar .btn{padding:9px 4px;font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
</style>
</head>
<body>

<div id="login" class="login hidden">
  <div class="logo" id="logo-big"></div>
  <div class="wm"><b>V.I.A.</b><span>TCG</span></div>
  <div class="box">
    <div class="small muted" style="margin:0 0 8px 2px">Chi sei?</div>
    <div class="who" id="who"></div>
    <label class="f"><span>Il tuo PIN</span><input id="pin" class="in-f" type="password" inputmode="numeric" autocomplete="current-password" placeholder="PIN personale"></label>
    <div class="err" id="login-err"></div>
    <button class="btn pri" style="width:100%;margin-top:6px" id="login-go">Entra</button>
  </div>
</div>

<div id="app" class="app hidden">
  <header>
    <div class="brand"><span id="logo-sm"></span><div class="wm"><b>V.I.A.</b><span>TCG</span></div></div>
    <button class="chip" id="user-chip" data-act="menu"></button>
    <button class="iconbtn" id="refresh" data-act="refresh" title="Aggiorna"></button>
  </header>
  <main id="view"><div class="loading">Caricamento…</div></main>
</div>

<button class="fab hidden" id="fab" data-act="fab" aria-label="Aggiungi"></button>
<nav class="hidden" id="nav"><div class="in"></div></nav>
<div id="modal"></div>
<div id="viewer"></div>
<div id="toast"></div>

<script>
/* ================================================================== */

function call(action, payload, pinOverride){
  const req = {pin:pinOverride!=null?pinOverride:S.pin, user:S.user, action:action, payload:payload||{}};
  return fetch(API_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(req), redirect:'follow', credentials:'omit'})
    .then(function(res){ if(!res.ok) throw new Error('Errore del server ('+res.status+'), riprova'); return res.json(); },
          function(){ throw new Error('Connessione assente: controlla internet e riprova'); })
    .then(function(r){
      if(!r) throw new Error('Risposta vuota dal server');
      if(!r.ok){
        if(action!=='cambiaPin'){
          if(r.code==='PIN' || r.code==='BLOCCATO') logout(r.error);
          else if(r.code==='CAMBIA_PIN') formCambioPin(true);
        }
        const e=new Error(r.error||'Errore'); e.code=r.code; throw e;
      }
      if(r.data) setData(r.data);
      return r;
    });
}

function addMonths(iso,k){
  const y=+iso.slice(0,4), m=+iso.slice(5,7)-1, d=+iso.slice(8,10);
  const tm=m+k, ty=y+Math.floor(tm/12), mm=((tm%12)+12)%12;
  const last=new Date(Date.UTC(ty,mm+1,0)).getUTCDate();
  return ty+'-'+('0'+(mm+1)).slice(-2)+'-'+('0'+Math.min(d,last)).slice(-2);
}

function piano(l){
  const P=Number(l.Importo), n=parseInt(l.NumRate,10), i=Number(l.TassoAnnuo)/100/12;
  if(!(P>0) || !(n>0) || !l.DataPrimaRata) return [];
  let rata=(l.RataFissa!==''&&l.RataFissa!=null&&Number(l.RataFissa)>0)?Number(l.RataFissa):(i===0?P/n:P*i/(1-Math.pow(1+i,-n)));
  rata=r2(rata);
  const out=[]; let res=P;
  for(let k=1;k<=n;k++){
    const int=r2(res*i); let cap=k===n?r2(res):r2(rata-int); if(cap>res) cap=r2(res);
    res=r2(res-cap);
    out.push({n:k,scadenza:addMonths(l.DataPrimaRata,k-1),rata:r2(cap+int),capitale:cap,interessi:int,residuo:res});
    if(res<=0) break;
  }
  return out;
}

const ENTRATE=['VERSAMENTO','VENDITA','ENTRATA','EROGAZIONE','CONGUAGLIO_IN'];
function calc(d){
  const P=d.prodotti.filter(act), M=d.primaNota.filter(act), L=d.prestiti.filter(act), SC=(d.scambi||[]).filter(act);
  const tot={}; Object.keys(TIPI).forEach(function(k){ tot[k]=0; });
  M.forEach(function(m){ if(tot[m.Tipo]!=null) tot[m.Tipo]+=Number(m.Importo)||0; });
  let entrate=0, uscite=0;
  Object.keys(tot).forEach(function(k){ if(ENTRATE.indexOf(k)>=0) entrate+=tot[k]; else uscite+=tot[k]; });
  const crediti=r2(M.filter(function(m){return m.Tipo==='VENDITA'&&m.DaIncassare===true;}).reduce(function(a,m){return a+(Number(m.Importo)||0);},0));
  const cassa=r2(entrate-uscite-crediti);
  const nKids={}; P.forEach(function(p){ if(p.ParentID) nKids[p.ParentID]=(nKids[p.ParentID]||0)+1; });
  const venduti=P.filter(sold);
  const magazzino=P.filter(function(p){ const s=stato(p); return s==='MAGAZZINO' || (s==='APERTO' && !nKids[p.ID]); });
  const ricavi=venduti.reduce(function(s,p){return s+Number(p.PrezzoVendita);},0);
  const costoVenduto=venduti.reduce(function(s,p){return s+costo(p);},0);
  const utileLordo=r2(ricavi-costoVenduto);
  const costoMag=r2(magazzino.reduce(function(s,p){return s+costo(p);},0));
  const arrivo=magazzino.filter(function(p){return p.InArrivo===true;}), costoArrivo=r2(arrivo.reduce(function(s,p){return s+costo(p);},0));
  const daIncassare=P.filter(daInc);
  const ggMedi=venduti.length? Math.round(venduti.reduce(function(s,p){return s+Math.max(0,days(p.DataAcquisto,p.DataVendita));},0)/venduti.length):0;
  const scambi=SC.map(function(s){
    const ric=P.filter(function(p){return p.ScambioInID===s.ID;}), dati=P.filter(function(p){return p.ScambioOutID===s.ID;});
    const vr=ric.reduce(function(a,p){return a+(Number(p.PrezzoAcquisto)||0);},0), cd=dati.reduce(function(a,p){return a+costo(p);},0);
    return {s:s,ric:ric,dati:dati,valoreRic:r2(vr),costoDati:r2(cd),risultato:r2(vr-cd-(Number(s.Conguaglio)||0))};
  });
  const risScambi=r2(scambi.reduce(function(a,x){return a+x.risultato;},0));
  const rate=M.filter(function(m){return m.Tipo==='RATA';});
  const interessi=r2(rate.reduce(function(s,m){return s+(Number(m.QuotaInteressi)||0);},0));
  const prestiti=L.map(function(l){
    const pl=piano(l), paid={};
    rate.filter(function(m){return m.RifPrestito===l.ID;}).forEach(function(m){ paid[Number(m.NumRata)]=m; });
    const capR=Object.keys(paid).reduce(function(s,k){return s+(Number(paid[k].QuotaCapitale)||0);},0);
    const intR=Object.keys(paid).reduce(function(s,k){return s+(Number(paid[k].QuotaInteressi)||0);},0);
    const next=pl.filter(function(r){return !paid[r.n];})[0]||null;
    const late=pl.filter(function(r){return !paid[r.n] && r.scadenza<=d.oggi;}).length;
    return {l:l,piano:pl,paid:paid,residuo:r2(Number(l.Importo)-capR),pagate:Object.keys(paid).length,next:next,late:late,
      intPagati:r2(intR),intTot:r2(pl.reduce(function(s,r){return s+r.interessi;},0)),rata:pl.length?pl[0].rata:0};
  });
  const debito=r2(prestiti.reduce(function(s,x){return s+x.residuo;},0));
  const spese={}; M.filter(function(m){return m.Tipo==='SPESA';}).forEach(function(m){ const c=m.Categoria||'Altro'; spese[c]=(spese[c]||0)+Number(m.Importo); });
  const utileNetto=r2(utileLordo+risScambi+tot.ENTRATA-tot.SPESA-interessi);
  const patrimonio=r2(cassa+crediti+costoMag-debito);
  const n=S.soci.length;
  const quotaSocio=function(tipo,s){ return M.filter(function(m){return m.Tipo===tipo;}).reduce(function(a,m){
    return a + (m.Socio===s ? Number(m.Importo) : m.Socio==='TUTTI' ? Number(m.Importo)/n : 0); },0); };
  const soci=S.soci.map(function(s){
    const v=quotaSocio('VERSAMENTO',s), p=quotaSocio('PRELIEVO',s), quota=r2(utileNetto/n);
    return {nome:s,versato:r2(v),prelevato:r2(p),netto:r2(v-p),quota:quota,spettanza:r2(v-p+quota)};
  });
  const aperti=P.filter(function(p){return p.Aperto===true;}).map(function(p){
    const k=P.filter(function(c){return c.ParentID===p.ID;}), kv=k.filter(sold);
    return {p:p,carte:k.length,vendute:kv.length,incassato:r2(kv.reduce(function(a,c){return a+Number(c.PrezzoVendita);},0)),
      risultato:r2(kv.reduce(function(a,c){return a+Number(c.PrezzoVendita)-costo(c);},0)),
      residuo:r2(k.filter(function(c){return stato(c)==='MAGAZZINO';}).reduce(function(a,c){return a+costo(c);},0))};
  });
  const mesi=[]; const now=d.oggi||today();
  for(let k=11;k>=0;k--){ mesi.push({m:addMonths(now.slice(0,7)+'-01',-k).slice(0,7),in:0,out:0}); }
  M.forEach(function(x){ if(x.Tipo==='VENDITA'&&x.DaIncassare===true) return; const dd=x.Tipo==='VENDITA'&&x.DataIncasso?x.DataIncasso:x.Data;
    const mm=mesi.filter(function(z){return z.m===String(dd).slice(0,7);})[0]; if(!mm||!TIPI[x.Tipo]) return;
    if(TIPI[x.Tipo].s>0) mm.in+=Number(x.Importo); else mm.out+=Number(x.Importo); });
  return {tot:tot,entrate:r2(entrate),uscite:r2(uscite),cassa:cassa,venduti:venduti,magazzino:magazzino,ricavi:r2(ricavi),costoVenduto:r2(costoVenduto),
    utileLordo:utileLordo,roi:costoVenduto?utileLordo/costoVenduto*100:0,costoMag:costoMag,ggMedi:ggMedi,interessi:interessi,prestiti:prestiti,
    debito:debito,spese:spese,utileNetto:utileNetto,patrimonio:patrimonio,soci:soci,mesi:mesi,scambi:scambi,risScambi:risScambi,aperti:aperti,
    versatoNetto:r2(tot.VERSAMENTO-tot.PRELIEVO), crediti:crediti, daIncassare:daIncassare, arrivo:arrivo, costoArrivo:costoArrivo,
    inGrading:P.filter(function(p){return p.GradStato==='DA_INVIARE'||p.GradStato==='INVIATA';}).length};
}

function chartTip(mesi,i){
  const m=mesi[i]; if(!m) return ''; const net=r2(m.in-m.out);
  return '<b>'+MESI_L[Number(m.m.slice(5,7))-1]+' '+m.m.slice(0,4)+'</b><span>Entrate <b class="pos">+'+eur(m.in)+'</b></span><span>Uscite <b class="neg">−'+eur(m.out)+'</b></span><span>Saldo <b class="'+cls(net)+'">'+eurS(net)+'</b></span>';

function chart(mesi){
  const W=640,H=220,pl=46,pb=24,pt=10, max=Math.max(1,Math.max.apply(null,mesi.map(function(m){return Math.max(m.in,m.out);})));
  const mag=Math.pow(10,Math.floor(Math.log10(max))), step=[1,2,2.5,5,10].map(function(x){return x*mag;}).filter(function(s){return max/s<=4;})[0]||mag*10;
  const top=Math.ceil(max/step)*step, cw=(W-pl)/mesi.length, bw=Math.min(14,cw/3);
  const y=function(v){return pt+(H-pt-pb)*(1-v/top);};
  let s='<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg" font-size="11" fill="#8b93a4">';
  for(let v=0;v<=top+1e-9;v+=step){ s+='<line x1="'+pl+'" x2="'+W+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="#262c38"/><text x="'+(pl-6)+'" y="'+(y(v)+4)+'" text-anchor="end">'+(v>=1000?(v/1000).toLocaleString('it-IT')+'k':v)+'</text>'; }
  mesi.forEach(function(m,i){
    const cx=pl+cw*i+cw/2;
    s+='<rect class="cm'+(i===mesi.length-1?' on':'')+'" data-act="chart-m" data-i="'+i+'" x="'+(pl+cw*i)+'" y="'+pt+'" width="'+cw+'" height="'+(H-pt)+'" rx="4"/>';
    s+='<rect x="'+(cx-bw-1)+'" y="'+y(m.in)+'" width="'+bw+'" height="'+Math.max(0,y(0)-y(m.in))+'" rx="2" fill="#3fbf6f"><title>Entrate '+eur(m.in)+'</title></rect>';
    s+='<rect x="'+(cx+1)+'" y="'+y(m.out)+'" width="'+bw+'" height="'+Math.max(0,y(0)-y(m.out))+'" rx="2" fill="#ef5b5b"><title>Uscite '+eur(m.out)+'</title></rect>';
    s+='<text x="'+cx+'" y="'+(H-6)+'" text-anchor="middle">'+MESI[Number(m.m.slice(5,7))-1]+'</text>';
  });
  return s+'</svg>';
}

function photoTag(id){ return id ? '<img data-foto="'+esc(id)+'" alt="">' : I.card; }
const fotoCache={}, fotoPending={};
function hydratePhotos(root){
  root.querySelectorAll('img[data-foto]').forEach(function(img){
    const id=img.getAttribute('data-foto');
    if(fotoCache[id]){ img.src=fotoCache[id]; return; }
    img.onerror=function(){ img.onerror=null; loadFoto(id).then(function(u){ img.src=u; }).catch(function(){}); };
    img.onload=function(){ if(!fotoCache[id] && img.src.indexOf('data:')!==0) fotoCache[id]=img.src; };
    img.src='https://drive.google.com/thumbnail?id='+encodeURIComponent(id)+'&sz=w800';
  });
}
function loadFoto(id){
  if(!fotoPending[id]) fotoPending[id]=call('getFoto',{id:id}).then(function(r){ fotoCache[id]=r.dataUrl; return r.dataUrl; });
  return fotoPending[id];
}

/* ---------- prodotti: filtri, ordinamento, gruppi ---------- */
function filtraProdotti(){
  const f=S.f, q=S.q.toLowerCase();
  return S.data.prodotti.filter(act).filter(function(p){
    const st=stato(p);
    if(f.stato==='GRADING'){ if(!(p.GradStato==='DA_INVIARE'||p.GradStato==='INVIATA')) return false; }
    else if(f.stato==='ARRIVO'){ if(!inArr(p)) return false; }
    else if(f.stato==='INCASSO'){ if(!daInc(p)) return false; }
    else if(f.stato && st!==f.stato) return false;
    if(f.nome && p.Nome!==f.nome) return false;
    if(f.cat && p.Categoria!==f.cat) return false;
    if(f.canA && p.CanaleAcquisto!==f.canA) return false;
    if(f.canV && p.CanaleVendita!==f.canV) return false;
    if(f.pag && (p.PagatoDa||'CASSA')!==f.pag) return false;
    if(f.inc && p.IncassatoDa!==f.inc) return false;
    if(f.cond && p.Condizione!==f.cond) return false;
    if(f.grad==='SI' && p.GradStato!=='GRADATA') return false;
    if(f.grad==='NO' && p.GradStato) return false;
    if(f.da && p.DataAcquisto<f.da) return false;
    if(f.a && p.DataAcquisto>f.a) return false;
    if(q && [p.Nome,p.Categoria,p.CanaleAcquisto,p.CanaleVendita,p.Note,p.GradCert].join(' ').toLowerCase().indexOf(q)<0) return false;
    return true;
  });
}
function roiOf(p){ const c=costo(p); return sold(p)&&c>0?(Number(p.PrezzoVendita)-c)/c*100:null; }
function sortProdotti(L){
  const k=S.sort, cmp={
    acq_desc:function(a,b){return a.DataAcquisto<b.DataAcquisto?1:a.DataAcquisto>b.DataAcquisto?-1:0;},
    acq_asc:function(a,b){return a.DataAcquisto>b.DataAcquisto?1:a.DataAcquisto<b.DataAcquisto?-1:0;},
    vend_desc:function(a,b){return (b.DataVendita||'')>(a.DataVendita||'')?1:(b.DataVendita||'')<(a.DataVendita||'')?-1:0;},
    pa_desc:function(a,b){return costo(b)-costo(a);}, pa_asc:function(a,b){return costo(a)-costo(b);},
    pv_desc:function(a,b){return (sold(b)?Number(b.PrezzoVendita):-1e9)-(sold(a)?Number(a.PrezzoVendita):-1e9);},
    pv_asc:function(a,b){return (sold(a)?Number(a.PrezzoVendita):1e9)-(sold(b)?Number(b.PrezzoVendita):1e9);},
    roi_desc:function(a,b){const x=roiOf(a),y=roiOf(b);return (y===null?-1e9:y)-(x===null?-1e9:x);},
    nome_asc:function(a,b){return a.Nome.localeCompare(b.Nome,'it');}, nome_desc:function(a,b){return b.Nome.localeCompare(a.Nome,'it');}
  }[k]||function(){return 0;};
  return L.slice().sort(function(a,b){ return cmp(a,b) || (a.CreatoIl<b.CreatoIl?-1:1); });
}
function fCount(){ return Object.keys(F0).filter(function(k){ return k!=='stato' && S.f[k]; }).length; }

function badgesProdotto(p){

function formData(f){
  const o={}; new FormData(f).forEach(function(v,k){ if(typeof v==='string') o[k]=v.trim(); });
  Object.keys(o).forEach(function(k){ if(o[k]==='__new__'){ o[k]=o[k+'__new']||''; } });
  Object.keys(o).forEach(function(k){ if(/__new$/.test(k)) delete o[k]; });
  return o;
}

const ATT={};
function attBox(key, list, onchange){
  ATT[key]={list:(list||[]).slice(), onchange:onchange||null};
  return '<div class="att" id="att-'+key+'">'+attInner(key)+'</div>';
}
function attInner(key){
  const a=ATT[key];
  return a.list.map(function(x,i){
    return '<div class="a">'+(x.tipo==='application/pdf'?'📄':'🧾')+'<span>'+esc(x.nome)+'</span><button type="button" class="btn sm" data-act="att-open" data-key="'+key+'" data-i="'+i+'">Apri</button>'+
      '<button type="button" class="btn sm dng" data-act="att-rm" data-key="'+key+'" data-i="'+i+'">✕</button></div>';
  }).join('')+'<div class="addrow">'+
    '<label class="btn sm">Fotocamera<input type="file" accept="image/*" capture="environment" class="hidden" data-att="'+key+'"></label>'+
    '<label class="btn sm">Galleria<input type="file" accept="image/*" class="hidden" data-att="'+key+'"></label>'+
    '<label class="btn sm">PDF / file<input type="file" accept="application/pdf,image/*" class="hidden" data-att="'+key+'"></label>'+
    '<span class="small muted" id="att-st-'+key+'"></span></div>';
}
function attRender(key){ const el=document.getElementById('att-'+key); if(el) el.innerHTML=attInner(key); }
function readFile(file){ return new Promise(function(res,rej){ const r=new FileReader(); r.onload=function(){res(r.result);}; r.onerror=function(){rej(new Error('File non leggibile'));}; r.readAsDataURL(file); }); }
async function onAttach(input){
  const key=input.getAttribute('data-att'), file=input.files&&input.files[0]; if(!file||!ATT[key]) return;
  const st=document.getElementById('att-st-'+key); if(st) st.textContent='Caricamento…';
  try{
    let dataUrl;
    if(file.type==='application/pdf'){ if(file.size>15*1024*1024) throw new Error('PDF troppo grande (max 15 MB)'); dataUrl=await readFile(file); }
    else dataUrl=await resizeImage(file, 2000, 0.85);
    const r=await call('uploadAllegato',{dataUrl:dataUrl, nome:file.name||'ricevuta'});
    ATT[key].list.push(r.allegato);
    if(ATT[key].onchange) await ATT[key].onchange(ATT[key].list);
    attRender(key);
  }catch(e){ toast('Allegato non caricato: '+e.message,true); if(st) st.textContent=''; }
  input.value='';
}
async function openAllegato(a){
  toast('Apertura…');
  try{
    const r=await call('getAllegato',{id:a.id});
    if(a.tipo==='application/pdf'){
      const bin=atob(r.dataUrl.split(',')[1]), arr=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
      const url=URL.createObjectURL(new Blob([arr],{type:'application/pdf'}));
      const w=window.open(url,'_blank');
      if(!w) openViewer('<iframe src="'+url+'" style="width:100%;height:75vh;border:0;border-radius:10px;background:#fff"></iframe><div class="actions"><a class="btn pri" href="'+url+'" download="'+esc(a.nome)+'">Scarica PDF</a></div>');
    } else openViewer('<img class="viewer" src="'+r.dataUrl+'">');
  }catch(e){ toast(e.message,true); }
}

/* ---------- immagini ---------- */
function resizeImage(file, max, q){
  return new Promise(function(res, rej){
    const url=URL.createObjectURL(file), img=new Image();
    img.onload=function(){
      const sc=Math.min(1,(max||1600)/Math.max(img.width,img.height));
      const c=document.createElement('canvas'); c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg',q||0.82));
    };
    img.onerror=function(){ URL.revokeObjectURL(url); rej(new Error('Immagine non leggibile')); };
    img.src=url;
  });
}
async function onPhoto(input){
  const file=input.files&&input.files[0]; if(!file) return;
  const f=input.closest('form'), pv=f.querySelector('.pv'), btn=f.querySelector('button[type=submit]');
  btn.disabled=true; pv.innerHTML='Caricamento…';
  try{
    const dataUrl=await resizeImage(file,1600,0.82);
    pv.innerHTML='<img src="'+dataUrl+'" alt="">';
    const r=await call('uploadFoto',{dataUrl:dataUrl});
    f.FotoId.value=r.id; fotoCache[r.id]=dataUrl;
    const rm=f.querySelector('[data-act=rm-photo]'); if(rm) rm.classList.remove('hidden');
  }catch(e){ pv.innerHTML='Errore'; toast('Foto non caricata: '+e.message,true); }
  finally{ input.value=''; btn.disabled=false; refreshForm(f); }
}
function refreshForm(f){
  if(f.id==='f-multi') liveMulti(f);
  else if(f.id==='f-prod') updateProdForm(f);
  else validateForm(f);
}
function photoBlock(id){

function multiChanges(f){

function arrivoMulti(f){

function liveIncasso(f){

function liveRoi(f){
  const el=document.getElementById('roi-live'); if(!el) return;
  const orig=origineOf(f), p=f._p;
  let c;
  if(orig==='ACQUISTO'){ const v=num(f.PrezzoAcquisto.value); const q=f._new?(parseInt(f.Quantita.value,10)||1):1; const modo=(f.querySelector('input[name=PrezzoModo]:checked')||{}).value;
    c = v===null?null:(q>1&&modo==='totale'?v/q:v); if(c!==null && q>1){ el.innerHTML='Lotto di <b>'+q+'</b> pezzi · '+eur(c)+' a pezzo · totale <b>'+eur(modo==='totale'?v:v*q)+'</b>'; return; } }
  else if(orig==='SCAMBIO'){ c=num(f.PrezzoAcquistoSc.value); }
  else { const par=prod(f.ParentID.value); c = p.ID ? Number(p.PrezzoAcquisto) : (par ? Number(par.PrezzoAcquisto)/(figli(par.ID).length+(parseInt(f.QuantitaSbu.value,10)||1)) : null); }
  if(c!==null && p.GradStato) c+=Number(p.GradCosto)||0;

  const d=r2(v-c), pc=c>0?d/c*100:0;
  el.innerHTML=(d>=0?'Guadagno ':'Perdita ')+'<b class="'+cls(d)+'">'+eurS(d)+'</b>'+(c>0?' · <b class="'+cls(d)+'">'+pct(pc)+'</b>':'')+' <span class="muted">(costo '+eur(c)+')</span>';

function mancanti(f){
  const o=formData(f), orig=origineOf(f), m=[];
  if(!o.Nome) m.push('Nome'); if(!o.Categoria) m.push('Categoria');
  if(orig==='ACQUISTO'){
    if(!o.DataAcquisto) m.push('DataAcquisto'); if(num(o.PrezzoAcquisto)===null||num(o.PrezzoAcquisto)<0) m.push('PrezzoAcquisto');
    if(!o.CanaleAcquisto) m.push('CanaleAcquisto'); if(!o.PagatoDa) m.push('PagatoDa');
    if(f._new && !(parseInt(o.Quantita,10)>=1)) m.push('Quantita');
    const chk=document.getElementById('chk-grad'); if(chk&&chk.checked&&!sealed(o.Categoria)){ if(!o.GradCasa) m.push('GradCasa'); if(!o.GradVoto) m.push('GradVoto'); }
  } else if(orig==='SBUSTATA'){
    if(!f.ParentID.value) m.push('ParentID'); if(!o.DataAcquistoSbu) m.push('DataAcquistoSbu');
    if(f._new && !(parseInt(o.QuantitaSbu,10)>=1)) m.push('QuantitaSbu');
  } else { if(!o.DataAcquistoSc) m.push('DataAcquistoSc'); if(num(o.PrezzoAcquistoSc)===null) m.push('PrezzoAcquistoSc'); }
  if(o.PrezzoVendita){ if(num(o.PrezzoVendita)===null) m.push('PrezzoVendita'); if(!o.DataVendita) m.push('DataVendita'); if(!o.CanaleVendita) m.push('CanaleVendita'); if(!o.IncassatoDa) m.push('IncassatoDa'); }
  return m;
}
const NOMI_CAMPI={Nome:'nome',Categoria:'categoria',DataAcquisto:'data di acquisto',PrezzoAcquisto:'prezzo di acquisto',CanaleAcquisto:'canale di acquisto',PagatoDa:'chi ha pagato',Quantita:'quantità',
  GradCasa:'casa di gradazione',GradVoto:'voto',ParentID:'prodotto sigillato',DataAcquistoSbu:'data di apertura',QuantitaSbu:'quantità',DataAcquistoSc:'data scambio',PrezzoAcquistoSc:'valore',
  PrezzoVendita:'prezzo di vendita',DataVendita:'data di vendita',CanaleVendita:'canale di vendita',IncassatoDa:'chi ha incassato',
  Data:'data',Importo:'importo',Socio:'socio',Controparte:'controparte',GradStato:'stato',Valore:'valore',GradDataInvio:'data di invio',GradPagatoDa:'chi ha pagato la gradazione',Note:'note',FotoId:'foto',Lingua:'lingua',Condizione:'condizione'};
function validateForm(f){
  if(!f || !f.id) return true;
  const m = f.id==='f-prod'?mancanti(f): f.id==='f-mov'?mancantiMov(f): f.id==='f-grad'?mancantiGrad(f): [];
  const e=document.getElementById('f-err');
  if(e && f._touched) e.textContent = m.length ? 'Impossibile salvare, da compilare: '+m.map(function(k){return NOMI_CAMPI[k]||k;}).join(', ') : '';
  if(f._touched) markBad(f,m);
  return !m.length;
}

}

    return '<label class="'+(i===0?'on':'')+'"><input type="radio" name="CostoModo" value="'+x[0]+'"'+(i===0?' checked':'')+'>'+x[1]+'</label>'; }).join('')+'</div>';
  h+='<div id="gm-costo"'+(giaInGrad?' class="hidden"':'')+'><div class="two">'+fld('<span id="gm-lbl">Costo totale</span>',money('CostoValore',''),'CostoValore')+fld('Pagato da',sel('GradPagatoDa',pagatori(),pg.same?pg.v:'','— scegli —'),'GradPagatoDa')+'</div></div>';
  h+='<div id="gm-voti"></div>';

function gmIds(f){ return Array.prototype.map.call(f.querySelectorAll('input[name=gcarta]:checked'),function(i){return i.value;}); }
function gmSalvaVoti(f){
  f.querySelectorAll('#gm-voti [data-gid]').forEach(function(r){ f._voti[r.getAttribute('data-gid')]={v:r.querySelector('[name=gv]').value, c:r.querySelector('[name=gc]').value}; });
}
function gmCosti(f,ids){
  const modo=(f.querySelector('input[name=CostoModo]:checked')||{}).value||'', v=num(f.CostoValore.value), n=ids.length;
  if(!modo) return null;
  if(v===null || !n) return ids.map(function(){return '';});
  if(modo==='unit') return ids.map(function(){return v;});
  const cents=Math.round(v*100), base=Math.floor(cents/n);
  return ids.map(function(_,i){ return (i===n-1 ? cents-base*(n-1) : base)/100; });
}
function liveGradMulti(f){

  if(aeKey){ const el=box.querySelector('[data-gid="'+aeKey[0]+'"] [name='+aeKey[1]+']'); if(el && el!==document.activeElement) el.focus(); }
  const costi=gmCosti(f,ids);

  if(ids.length && costi && costi[0]!=='') { const tot=costi.reduce(function(a,x){return a+x;},0); t+=' · costo '+eur(tot)+(ids.length>1?' ('+(modo==='totale'?'circa '+eur(tot/ids.length):eur(costi[0]))+' a carta)':''); }
  document.getElementById('gm-live').innerHTML=t;
}
function gmPayloads(f){
  gmSalvaVoti(f);
  const o=formData(f), ids=gmIds(f), costi=gmCosti(f,ids), m=[];
  if(!ids.length) throw new Error('Seleziona almeno una carta');
  if(!o.GradStato) m.push('stato'); if(!o.GradCasa) m.push('casa di gradazione');
  if(m.length) throw new Error('Da compilare: '+m.join(', '));
  if(costi && num(f.CostoValore.value)===null) throw new Error('Inserisci il costo, oppure scegli "Non cambiare"');
  return ids.map(function(id,i){
    const p=prod(id), v=f._voti[id]||{v:p.GradVoto||'',c:p.GradCert||''};
    const x={id:id, GradStato:o.GradStato, GradCasa:o.GradCasa,
      GradVoto:o.GradStato==='GRADATA'?String(v.v||'').trim():(p.GradVoto||''), GradCert:o.GradStato==='GRADATA'?String(v.c||'').trim():(p.GradCert||''),
      GradDataInvio:o.GradDataInvio||p.GradDataInvio||'', GradDataRientro:o.GradDataRientro||p.GradDataRientro||'',
      GradCosto:costi?costi[i]:(p.GradCosto===''||p.GradCosto==null?'':Number(p.GradCosto)),
      GradPagatoDa:costi?o.GradPagatoDa:(p.GradPagatoDa||''), Allegati:ATT.gradm&&ATT.gradm.list.length?ATT.gradm.list:null};
    if(x.GradStato==='GRADATA' && !x.GradVoto) throw new Error('Manca il voto di "'+p.Nome+'"');
    if(Number(x.GradCosto)>0){
      if(!x.GradDataInvio) throw new Error('Inserisci la data di invio (è la data del costo)');
      if(!x.GradPagatoDa) throw new Error('Indica chi ha pagato la gradazione');
    }
    if(x.GradDataInvio && x.GradDataRientro && x.GradDataRientro<x.GradDataInvio) throw new Error('La data di rientro è precedente all\'invio');
    x._nome=p.Nome; return x;
  });
}
async function salvaGradMulti(f){
  const err=document.getElementById('f-err'), btn=f.querySelector('button[type=submit]');
  let L; try{ L=gmPayloads(f); }catch(e){ err.textContent=e.message; return; }
  err.textContent=''; btn.disabled=true;
  for(let i=0;i<L.length;i++){
    btn.textContent='Salvataggio '+(i+1)+' di '+L.length+'…';
    const x=Object.assign({},L[i]); delete x._nome;
    try{ await call('gradazione',x); }
    catch(e){
      btn.disabled=false; btn.textContent='Riprova';
      err.textContent=(i?'Salvate '+i+' carte su '+L.length+'. ':'')+'Errore su "'+L[i]._nome+'": '+e.message;
      return;
    }
  }
  closeModal(); toast('Gradazione salvata su '+L.length+' cart'+(L.length===1?'a':'e'));
}

async function onToggle(t){
  const k=t.getAttribute('data-tg'), id=t.getAttribute('data-id');
  if(k==='incasso' && t.checked){ t.checked=false; return formIncasso([id]); }
  t.disabled=true;
  try{
    if(k==='arrivo') await call('arrivo', t.checked ? {ids:[id], data:today()} : {ids:[id], arrivato:false});
    else await call('incasso', {ids:[id], incassato:false});
    toast(k==='arrivo' ? (t.checked?'Segnato come arrivato':'Segnato come in arrivo') : 'Segnato come da incassare');
  }catch(e){ t.checked=!t.checked; t.disabled=false; toast(e.message,true); }
}

function liveScambio(f){
  const ids=Array.prototype.map.call(f.querySelectorAll('input[name=dato]:checked'),function(i){return i.value;});
  const cd=ids.reduce(function(a,id){return a+costo(prod(id));},0);
  const tipo=f.ConguaglioTipo.value, cg=num(f.Conguaglio.value)||0, signed=tipo==='PAGATO'?cg:tipo==='RICEVUTO'?-cg:0;
  document.getElementById('sc-pag').classList.toggle('hidden', tipo!=='PAGATO');
  const sugg=Math.max(0,cd+signed);
  const lines=readLines(f).filter(function(l){return l.Nome||l._el===f.querySelector('.line');});
  const pezzi=lines.reduce(function(a,l){return a+l.Quantita;},0)||1;
  const manual=lines.filter(function(l){return l._auto!=='1';}), auto=lines.filter(function(l){return l._auto==='1';});
  const manTot=manual.reduce(function(a,l){return a+(num(l.Valore)||0)*l.Quantita;},0), autoPz=auto.reduce(function(a,l){return a+l.Quantita;},0);
  const unit=autoPz?Math.max(0,(sugg-manTot)/autoPz):0;
  auto.forEach(function(l){ const e=l._el.querySelector('[name=l_val]'); if(e && document.activeElement!==e) e.value=String(r2(unit)).replace('.',','); });
  const tot=readLines(f).reduce(function(a,l){return a+(num(l.Valore)||0)*l.Quantita;},0), ris=r2(tot-sugg);
  document.getElementById('sc-live').innerHTML='Costo dei prodotti dati <b>'+eur(cd)+'</b>'+(signed?' · conguaglio '+(signed>0?'pagato ':'ricevuto ')+eur(Math.abs(signed)):'')+
    '<br>Valore suggerito per i ricevuti <b>'+eur(sugg)+'</b> · valore inserito <b>'+eur(tot)+'</b>'+
    (Math.abs(ris)>=0.01?'<br>Risultato dello scambio: <b class="'+cls(ris)+'">'+eurS(ris)+'</b>':'<br><span class="muted">Nessun utile o perdita sullo scambio.</span>')+
    '<div class="hint">Il valore dei ricevuti è calcolato in automatico dividendo il valore suggerito; puoi cambiarlo a mano su ogni riga.</div>';
}

  if(a==='switch-user'){ closeModal(); store.del('pin'); S.pin=''; return showLogin(); }
  if(a==='logout'){ closeModal(); return logout(''); }
});
document.addEventListener('change', function(e){ if(e.target.id==='chk-grad'){ updateProdForm(e.target.closest('form')); } });

/* ================================================================== */
/* Accesso                                                             */
/* ================================================================== */
function showLogin(msg){
  ['app','nav','fab'].forEach(function(i){ document.getElementById(i).classList.add('hidden'); });
  document.getElementById('login').classList.remove('hidden');
  document.getElementById('logo-big').innerHTML=LOGO;
  let selU=S.user;
  const who=document.getElementById('who');
  function draw(){ who.innerHTML=S.soci.map(function(s){return '<button type="button" class="'+(s===selU?'on':'')+'" data-u="'+esc(s)+'">'+esc(s)+'</button>';}).join(''); }
  draw();
  who.onclick=function(e){ const b=e.target.closest('[data-u]'); if(b){ selU=b.getAttribute('data-u'); draw(); } };
  document.getElementById('pin').value=S.pin;
  document.getElementById('login-err').textContent=msg||'';
  document.getElementById('login-go').onclick=async function(){
    const pin=document.getElementById('pin').value.trim(), err=document.getElementById('login-err');
    if(!selU){ err.textContent='Scegli chi sei'; return; }
    if(!pin){ err.textContent='Inserisci il tuo PIN'; return; }
    S.pin=pin; S.user=selU; this.disabled=true; err.textContent='';
    try{ await start(); store.set('pin',pin); store.set('user',selU); }
    catch(e){ if(e.code!=='CAMBIA_PIN') document.getElementById('login-err').textContent=e.message; }
    finally{ this.disabled=false; }
  };
  document.getElementById('pin').onkeydown=function(e){ if(e.key==='Enter') document.getElementById('login-go').click(); };
}
async function start(){
  const r=await call('getAll');
  document.getElementById('login').classList.add('hidden');
  ['app','nav','fab'].forEach(function(i){ document.getElementById(i).classList.remove('hidden'); });
  document.getElementById('logo-sm').innerHTML=LOGO; document.getElementById('fab').innerHTML=I.plus+'<span>Aggiungi</span>'; fabExt(); spinRefresh(false);
  return r;
}
function logout(msg){ store.del('pin'); S.pin=''; S.data=null; closeModal(); showLogin(msg||''); }
(function init(){
  if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(function(){});
  if(S.pin && S.user){ start().catch(function(e){ if(e.code!=='CAMBIA_PIN') showLogin(e.message); }); }
  else showLogin();
})();
</script>
